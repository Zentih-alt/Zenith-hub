<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน - Zenith Shop</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
    <script src="config.js"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-800/80 border-b border-slate-700 p-4 sticky top-0 z-50 backdrop-blur">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="zenith-logo.png" alt="Zenith Logo" class="h-8 w-8 object-contain" onerror="this.src='[https://via.placeholder.com/32](https://via.placeholder.com/32)'">
                <h1 class="text-xl font-bold text-cyan-400">Zenith Admin Panel</h1>
            </div>
            <a href="index.html" class="text-slate-300 hover:text-white flex items-center gap-2 bg-slate-700 px-3 py-1.5 rounded-lg text-sm">
                <i class="fa-solid fa-house"></i> กลับหน้าหลัก
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- ฟอร์มเพิ่มสินค้า -->
        <div class="lg:col-span-1 bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-cyan-400">
                <i class="fa-solid fa-plus-circle"></i> เพิ่มสินค้าใหม่
            </h2>
            <form id="addProductForm" onsubmit="handleProductSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ชื่อสินค้า *</label>
                    <input type="text" id="prodName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">หมวดหมู่สินค้า *</label>
                    <select id="prodCategory" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-500 outline-none text-slate-200">
                        <option value="">-- กำลังโหลดหมวดหมู่ --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">ราคา (บาท) *</label>
                    <input type="number" id="prodPrice" min="0" step="0.01" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">รูปภาพ URL *</label>
                    <input type="url" id="prodImage" required placeholder="[https://example.com/image.png](https://example.com/image.png)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">รายละเอียดสินค้า</label>
                    <textarea id="prodDesc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">ข้อมูลลับ / โค้ดสินค้า (สำหรับผู้ซื้อ)</label>
                    <textarea id="prodSecret" rows="2" placeholder="เช่น Username:Password หรือ Redeem Code" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-cyan-500 outline-none font-mono"></textarea>
                </div>

                <button type="submit" id="btnSubmit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <i class="fa-solid fa-save"></i> บันทึกสินค้า
                </button>
            </form>
        </div>

        <!-- รายการสินค้าทั้งหมด -->
        <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2 text-cyan-400">
                    <i class="fa-solid fa-boxes-stacked"></i> รายการสินค้าทั้งหมด
                </h2>
                <button onclick="loadAdminProducts()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1">
                    <i class="fa-solid fa-rotate"></i> รีเฟรช
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-slate-300">
                    <thead class="text-xs uppercase bg-slate-900/60 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="p-3">สินค้า</th>
                            <th class="p-3">หมวดหมู่</th>
                            <th class="p-3">ราคา</th>
                            <th class="p-3 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="productList" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-500">กำลังโหลดรายการสินค้า...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Container สำหรับ Toast แจ้งเตือน -->
    <div id="toast" class="fixed bottom-5 right-5 hidden bg-slate-800 text-white px-5 py-3 rounded-xl border shadow-xl z-50 transition-all duration-300"></div>

    <script>
        // เรียกใช้อินสแตนซ์ Supabase จาก config.js
        const supabase = window.supabaseClient;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();
            await loadAdminProducts();
        });

        // แจ้งเตือน Toast
        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `fixed bottom-5 right-5 px-5 py-3 rounded-xl border shadow-xl z-50 transition-all duration-300 ${
                isSuccess ? 'bg-emerald-900/90 border-emerald-500 text-emerald-200' : 'bg-rose-900/90 border-rose-500 text-rose-200'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        // ดึงรายการหมวดหมู่
        async function loadCategories() {
            const select = document.getElementById('prodCategory');
            try {
                const { data, error } = await supabase.from('categories').select('*').order('name');
                if (error) throw error;

                if (!data || data.length === 0) {
                    select.innerHTML = '<option value="">-- ไม่พบหมวดหมู่ (โปรดสร้างใน DB) --</option>';
                    return;
                }

                select.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>' + 
                    data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (err) {
                console.error('Error loading categories:', err);
                select.innerHTML = '<option value="">-- โหลดหมวดหมู่ไม่สำเร็จ --</option>';
            }
        }

        // เพิ่มสินค้า
        async function handleProductSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            
            const category_id = document.getElementById('prodCategory').value;
            const name = document.getElementById('prodName').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const image_url = document.getElementById('prodImage').value.trim();
            const description = document.getElementById('prodDesc').value.trim();
            const secret_data = document.getElementById('prodSecret').value.trim();

            if (!category_id) {
                showToast('กรุณาเลือกหมวดหมู่สินค้า', false);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';

            try {
                const payload = {
                    name,
                    category_id,
                    price,
                    image_url,
                    description,
                    secret_data: secret_data || null,
                    is_active: true
                };

                const { data, error } = await supabase.from('products').insert([payload]).select();

                if (error) throw error;

                showToast('เพิ่มสินค้าสำเร็จแล้ว!', true);
                document.getElementById('addProductForm').reset();
                await loadAdminProducts();
            } catch (err) {
                console.error('Error adding product:', err);
                showToast(`เกิดข้อผิดพลาด: ${err.message}`, false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save"></i> บันทึกสินค้า';
            }
        }

        // โหลดรายการสินค้าสำหรับ Admin
        async function loadAdminProducts() {
            const tbody = document.getElementById('productList');
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*, categories(name)')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">ยังไม่มีสินค้าในระบบ</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(item => `
                    <tr class="hover:bg-slate-700/30">
                        <td class="p-3 flex items-center gap-3">
                            <img src="${item.image_url}" class="w-10 h-10 object-cover rounded" onerror="this.src='[https://via.placeholder.com/40](https://via.placeholder.com/40)'">
                            <div>
                                <div class="font-medium text-slate-200">${item.name}</div>
                                <div class="text-xs text-slate-500">${item.id.substring(0, 8)}...</div>
                            </div>
                        </td>
                        <td class="p-3 text-slate-400">${item.categories?.name || 'ไม่มีหมวดหมู่'}</td>
                        <td class="p-3 font-semibold text-emerald-400">฿${parseFloat(item.price).toLocaleString()}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteProduct('${item.id}', '${item.name}')" class="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white px-3 py-1.5 rounded-lg text-xs transition-colors">
                                <i class="fa-solid fa-trash"></i> ลบ
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error loading admin products:', err);
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-rose-400">เกิดข้อผิดพลาดในการดึงข้อมูล: ${err.message}</td></tr>`;
            }
        }

        // ลบสินค้า
        async function deleteProduct(id, name) {
            if (!confirm(`คุณต้องการลบสินค้า "${name}" ใช่หรือไม่?`)) return;

            try {
                const { error } = await supabase.from('products').delete().eq('id', id);
                if (error) throw error;

                showToast(`ลบสินค้า "${name}" เรียบร้อยแล้ว`, true);
                await loadAdminProducts();
            } catch (err) {
                console.error('Error deleting product:', err);
                showToast(`ลบไม่สำเร็จ: ${err.message}`, false);
            }
        }
    </script>
</body>
</html>
